name: iOS simulator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and list simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build simulator app
        run: xcodebuild -project PersonalFitness.xcodeproj -scheme PersonalFitness -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run hosted unit tests
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-27-0" in k for x in v if x["name"] == "iPhone 17e" and x["isAvailable"]))')
          xcodebuild -project PersonalFitness.xcodeproj -scheme PersonalFitness -destination "platform=iOS Simulator,id=$SIM_ID" -only-testing:PersonalFitnessTests -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO test
